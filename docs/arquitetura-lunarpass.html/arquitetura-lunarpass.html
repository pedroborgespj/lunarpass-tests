<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LunarPass em Três Camadas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Karla:wght@300;400;500;600&display=swap">
<style>
  :root {
    --ground: #0b0d14;
    --ground-deep: #07080d;
    --surface: rgba(24, 26, 36, 0.72);
    --surface-solid: #171922;
    --line: #2b2d3a;
    --line-soft: #1f212c;
    --ink: #efede4;
    --muted: #97948a;
    --faint: #6b6960;
    --moon: #e9dcb0;
    --crater: #b9ac83;
    --halo: rgba(233, 220, 176, 0.10);
    --accent: #d9c383;
    --accent-soft: rgba(217, 195, 131, 0.14);
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: "Karla", system-ui, sans-serif;
    font-weight: 300;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  /* ===== atmosphere ===== */
  .sky {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(1200px 700px at 50% -10%, rgba(233, 220, 176, 0.07), transparent 60%),
      radial-gradient(900px 600px at 82% 108%, rgba(233, 220, 176, 0.045), transparent 55%),
      linear-gradient(180deg, var(--ground) 0%, var(--ground-deep) 100%);
  }
  .sky svg { width: 100%; height: 100%; display: block; }
  .star { fill: var(--moon); }
  @keyframes twinkle {
    0%, 100% { opacity: 0.16; }
    50%      { opacity: 0.55; }
  }
  .star { animation: twinkle 5.5s ease-in-out infinite; }
  .star:nth-child(3n)  { animation-delay: -1.8s; animation-duration: 6.5s; }
  .star:nth-child(4n)  { animation-delay: -3.2s; animation-duration: 7.5s; }
  .star:nth-child(5n)  { animation-delay: -4.6s; animation-duration: 5s; }

  /* ===== slide frame ===== */
  .page {
    position: relative;
    height: 100dvh;
    max-width: 1200px;
    margin: 0 auto;
    padding: clamp(20px, 3.5vh, 44px) clamp(24px, 4vw, 56px) clamp(18px, 3vh, 36px);
    display: grid;
    grid-template-rows: auto 1fr auto;
    row-gap: clamp(12px, 2.4vh, 28px);
  }

  /* ===== header ===== */
  header {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(10px, 1.8vh, 18px);
    animation: rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  .brand-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(18px, 2.8vw, 32px);
  }

  /* moon in orbit */
  .mark-wrap {
    position: relative;
    flex-shrink: 0;
    width: clamp(64px, 12vh, 104px);
    aspect-ratio: 1;
    display: grid;
    place-items: center;
  }
  .mark {
    width: 72%;
    height: auto;
    display: block;
    filter: drop-shadow(0 0 30px rgba(233, 220, 176, 0.28));
  }
  .orbit {
    position: absolute;
    inset: 0;
    animation: orbit 40s linear infinite;
  }
  .orbit circle.path {
    fill: none;
    stroke: var(--accent);
    stroke-opacity: 0.28;
    stroke-width: 1;
    stroke-dasharray: 2.5 5;
  }
  .orbit circle.satellite {
    fill: var(--accent);
  }
  @keyframes orbit { to { transform: rotate(360deg); } }

  /* divider between logo and text */
  .brand-divider {
    align-self: stretch;
    width: 1px;
    margin: clamp(6px, 1.2vh, 12px) 0;
    background: linear-gradient(180deg, transparent, var(--accent) 30%, var(--accent) 70%, transparent);
    opacity: 0.4;
  }

  .wordmark {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    text-align: left;
    gap: clamp(4px, 0.9vh, 10px);
  }
  .wordmark span {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-weight: 600;
    font-size: clamp(10px, 1.45vh, 13.5px);
    letter-spacing: 0.46em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .wordmark span::after {
    content: "";
    width: clamp(28px, 4vw, 48px);
    height: 1px;
    background: linear-gradient(to right, var(--accent), transparent);
    opacity: 0.6;
  }
  h1 {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 300;
    font-size: clamp(30px, 6vh, 56px);
    line-height: 1.06;
    letter-spacing: -0.014em;
    margin: 0;
    text-wrap: balance;
    background: linear-gradient(105deg, var(--ink) 45%, var(--moon) 82%, #b7a86f 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .rule {
    position: relative;
    width: min(560px, 72%);
    height: 1px;
    margin-top: clamp(2px, 0.8vh, 8px);
    background: linear-gradient(to right, transparent, var(--accent), transparent);
    opacity: 0.45;
  }
  .rule::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: 5px;
    height: 5px;
    transform: translate(-50%, -50%) rotate(45deg);
    background: var(--ground);
    border: 1px solid var(--accent);
  }

  /* ===== diagram ===== */
  figure {
    margin: 0;
    min-height: 0;
    display: grid;
    grid-template-rows: 1fr auto;
    row-gap: clamp(10px, 2vh, 20px);
    background: var(--surface);
    border: 1px solid var(--line-soft);
    border-radius: 6px;
    padding: clamp(16px, 3vh, 32px) clamp(16px, 3vw, 36px);
    backdrop-filter: blur(6px);
    box-shadow:
      0 1px 0 rgba(255, 255, 255, 0.03) inset,
      0 30px 80px -30px rgba(0, 0, 0, 0.65);
    animation: rise 0.9s 0.15s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  .flow-wrap {
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  svg.flow {
    width: 100%;
    height: 100%;
    max-height: 100%;
    color: var(--ink);
  }

  figcaption {
    font-size: clamp(13px, 1.9vh, 16.5px);
    color: var(--muted);
    max-width: 68ch;
    margin: 0 auto;
    text-align: center;
    line-height: 1.55;
  }
  figcaption em {
    font-family: "Fraunces", Georgia, serif;
    font-style: italic;
    color: var(--ink);
  }

  /* ===== diagram internals ===== */
  .node        { fill: var(--surface-solid); stroke: var(--line); }
  .node-accent { fill: var(--accent-soft); stroke: var(--accent); stroke-opacity: 0.7; }
  .eyebrow     { font-family: "Karla", sans-serif; font-weight: 600; font-size: 10.5px; letter-spacing: 2.6px; fill: var(--faint); }
  .eyebrow-a   { fill: var(--accent); opacity: 0.85; }
  .node-title  { font-family: "Fraunces", Georgia, serif; font-size: 19px; fill: var(--ink); }
  .node-title-a{ fill: var(--accent); }
  .detail      { font-family: "Karla", sans-serif; font-size: 12.5px; fill: var(--muted); }
  .edge-label  { font-family: "Karla", sans-serif; font-size: 12.5px; fill: var(--muted); }
  .edge-label-a{ fill: var(--accent); opacity: 0.9; }

  .edge   { fill: none; stroke: var(--muted); stroke-opacity: 0.75; stroke-width: 1.4; }
  .edge-a { fill: none; stroke: var(--accent); stroke-opacity: 0.95; stroke-width: 1.4; }

  .draw {
    stroke-dasharray: 600;
    stroke-dashoffset: 600;
    animation: draw 1.1s ease forwards;
  }
  .draw.d1 { animation-delay: 0.7s; }
  .draw.d2 { animation-delay: 1.0s; }
  .draw.d3 { animation-delay: 1.25s; }

  .pop { opacity: 0; animation: fade 0.7s ease forwards; }
  .pop.p1 { animation-delay: 0.35s; }
  .pop.p2 { animation-delay: 0.5s; }
  .pop.p3 { animation-delay: 0.65s; }
  .pop.p4 { animation-delay: 0.8s; }
  .pop.p5 { animation-delay: 1.5s; }
  .pop.p6 { animation-delay: 1.7s; }

  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes fade { to { opacity: 1; } }
  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .star, .draw, .pop, header, figure, .orbit { animation: none !important; }
    .draw { stroke-dashoffset: 0; }
    .pop { opacity: 1; }
  }

  @media (max-width: 640px) {
    body { overflow: auto; }
    .page { height: auto; min-height: 100dvh; }
    .flow-wrap { overflow-x: auto; }
    svg.flow { min-width: 640px; }
  }
</style>
</head>
<body>

<div class="sky" aria-hidden="true">
  <svg viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
    <circle class="star" cx="120" cy="140" r="1.3"/>
    <circle class="star" cx="260" cy="520" r="1"/>
    <circle class="star" cx="340" cy="90"  r="1.6"/>
    <circle class="star" cx="470" cy="300" r="0.9"/>
    <circle class="star" cx="590" cy="740" r="1.2"/>
    <circle class="star" cx="700" cy="160" r="1"/>
    <circle class="star" cx="820" cy="620" r="1.4"/>
    <circle class="star" cx="930" cy="80"  r="1"/>
    <circle class="star" cx="1040" cy="420" r="1.5"/>
    <circle class="star" cx="1150" cy="200" r="0.9"/>
    <circle class="star" cx="1260" cy="680" r="1.2"/>
    <circle class="star" cx="1360" cy="120" r="1.4"/>
    <circle class="star" cx="180" cy="780" r="1"/>
    <circle class="star" cx="1330" cy="460" r="0.9"/>
    <circle class="star" cx="60"  cy="400" r="1.2"/>
    <circle class="star" cx="760" cy="860" r="1"/>
    <circle class="star" cx="520" cy="560" r="0.8"/>
    <circle class="star" cx="990" cy="760" r="0.8"/>
  </svg>
</div>

<div class="page">
  <header>
    <div class="brand-row">
    <div class="mark-wrap">
      <svg class="orbit" viewBox="0 0 100 100" aria-hidden="true">
        <circle class="path" cx="50" cy="50" r="48"/>
        <circle class="satellite" cx="50" cy="2" r="2.2"/>
      </svg>
    <svg class="mark" viewBox="0 0 85.35 85.35" role="img" aria-label="Logotipo LunarPass">
      <defs>
        <clipPath id="lp-crescent">
          <path d="M82.22,3.12v79.1H26.85c21.84,0,39.55-17.71,39.55-39.55S48.7,3.12,26.85,3.12h55.37Z"/>
        </clipPath>
      </defs>
      <circle cx="42.67" cy="42.67" r="42.67" fill="var(--halo)"/>
      <g clip-path="url(#lp-crescent)">
        <circle cx="42.67" cy="42.67" r="39.55" fill="var(--moon)"/>
        <g fill="var(--crater)">
          <circle cx="33.5" cy="29.81" r="5.94"/>
          <circle cx="40.99" cy="17.71" r="2.88"/>
          <circle cx="22.12" cy="38.63" r="2.88"/>
          <circle cx="14.4" cy="28.2" r="1.61"/>
          <circle cx="17.62" cy="52.81" r="1.61"/>
          <circle cx="31.46" cy="14.83" r="2.04"/>
          <circle cx="43.87" cy="38.63" r="2.04"/>
          <circle cx="65.39" cy="29.81" r="3.95"/>
          <circle cx="70.95" cy="24.25" r="1.61"/>
          <circle cx="45.91" cy="63.7" r="8.85"/>
          <circle cx="69.68" cy="49.93" r="2.88"/>
          <circle cx="61.44" cy="54.85" r="2.04"/>
          <circle cx="35.44" cy="70.95" r="1.61"/>
        </g>
      </g>
    </svg>
    </div>

    <div class="brand-divider"></div>

    <div class="wordmark">
      <span>LunarPass</span>
      <h1>Arquitetura básica do projeto</h1>
    </div>
    </div>
    <div class="rule"></div>
  </header>

  <figure>
    <div class="flow-wrap">
      <svg class="flow" viewBox="0 0 760 330" role="img" aria-label="O cliente consulta e reserva direto na base compartilhada; a equipe de operação passa antes por uma verificação de identidade e permissão. Os dois chegam à mesma base.">
        <defs>
          <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
            <path d="M 0 1 L 9 5 L 0 9 z" fill="var(--muted)"/>
          </marker>
          <marker id="tip-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
            <path d="M 0 1 L 9 5 L 0 9 z" fill="var(--accent)"/>
          </marker>
        </defs>

        <!-- Cliente -->
        <g class="pop p1">
          <rect class="node" x="20" y="22" width="196" height="100" rx="4"/>
          <g transform="translate(104,30) scale(1.4)" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
            <path d="M4.5 6.5 h11 l1.2 10 h-13.4 z"/>
            <path d="M7.5 6.5 a2.5 2.5 0 0 1 5 0"/>
          </g>
          <text class="eyebrow" x="118" y="76" text-anchor="middle">CLIENTE</text>
          <text class="node-title" x="118" y="101" text-anchor="middle">Storefront</text>
        </g>

        <!-- Pagamento (Stripe) -->
        <g class="pop p2">
          <rect class="node-accent" x="290" y="42" width="168" height="80" rx="4"/>
          <g transform="translate(430,98)" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
            <rect x="2.5" y="4.5" width="15" height="11" rx="1.6"/>
            <path d="M2.5 8.2 h15"/>
            <path d="M5.5 12.5 h4"/>
          </g>
          <text class="eyebrow eyebrow-a" x="374" y="72" text-anchor="middle">SERVER FUNCTION</text>
          <text class="node-title node-title-a" x="374" y="99" text-anchor="middle">Stripe</text>
        </g>

        <!-- Operação -->
        <g class="pop p2">
          <rect class="node" x="20" y="192" width="196" height="100" rx="4"/>
          <g transform="translate(104,198) scale(1.4)" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
            <rect x="2.5" y="3.5" width="15" height="10" rx="1.4"/>
            <path d="M10 13.5 v3 M6.8 16.5 h6.4"/>
            <path d="M5.5 7 l2 2 -2 2 M9.5 11 h3"/>
          </g>
          <text class="eyebrow" x="118" y="246" text-anchor="middle">EQUIPE</text>
          <text class="node-title" x="118" y="271" text-anchor="middle">Mission Control</text>
        </g>

        <!-- Verificação -->
        <g class="pop p3">
          <rect class="node-accent" x="290" y="212" width="168" height="80" rx="4"/>
          <g transform="translate(430,266)" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
            <path d="M10 2.5 l6 2.4 v4.6 c0 3.6-2.5 6.1-6 7.5 c-3.5-1.4-6-3.9-6-7.5 v-4.6 z"/>
            <path d="M7.5 9.5 l1.8 1.8 3.2-3.6"/>
          </g>
          <text class="eyebrow eyebrow-a" x="374" y="242" text-anchor="middle">SERVER FUNCTION</text>
          <text class="node-title node-title-a" x="374" y="269" text-anchor="middle">Auth</text>
        </g>

        <!-- Base -->
        <g class="pop p4">
          <rect class="node" x="540" y="78" width="200" height="174" rx="4"/>
          <g transform="translate(554,90)" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
            <ellipse cx="10" cy="4.5" rx="6.5" ry="2.4"/>
            <path d="M3.5 4.5 v10 a6.5 2.4 0 0 0 13 0 v-10"/>
            <path d="M3.5 9.5 a6.5 2.4 0 0 0 13 0"/>
          </g>
          <text class="eyebrow" x="640" y="106" text-anchor="middle">DATABASE</text>
          <text class="node-title" x="640" y="133" text-anchor="middle">PostgreSQL</text>
          <line x1="572" y1="150" x2="708" y2="150" stroke="var(--line)" stroke-width="1"/>
          <text class="detail" x="640" y="172" text-anchor="middle">missions</text>
          <text class="detail" x="640" y="192" text-anchor="middle">reservations</text>
          <text class="detail" x="640" y="212" text-anchor="middle">tickets</text>
          <text class="detail" x="640" y="232" text-anchor="middle">user_roles</text>
        </g>

        <!-- Cliente -> Pagamento -->
        <path class="edge-a draw d1" d="M 216 82 L 285 82" marker-end="url(#tip-a)"/>
        <!-- Pagamento -> Base -->
        <path class="edge-a draw d1" d="M 458 82 L 498 82 L 498 136 L 535 136" marker-end="url(#tip-a)"/>

        <!-- Operação -> Verificação -->
        <path class="edge-a draw d2" d="M 216 252 L 285 252" marker-end="url(#tip-a)"/>

        <!-- Verificação -> Base -->
        <path class="edge-a draw d3" d="M 458 252 L 498 252 L 498 194 L 535 194" marker-end="url(#tip-a)"/>
      </svg>
    </div>

    <figcaption>De um lado, o cliente que compra sua viagem à Lua. Do outro, a equipe que cria e mantém as missões à venda. Os dois consultam a mesma base de informação, com níveis de acesso diferentes.</figcaption>
  </figure>
</div>

</body>
</html>
